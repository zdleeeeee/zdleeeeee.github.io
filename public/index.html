<script>
    
    (function () {
        var trigger = document.getElementById("menu-trigger");
        var menu = document.getElementById("menu");
        if (!trigger || !menu) return;

        function setOpen(open) {
            menu.classList.toggle("menu-open", open);
            trigger.classList.toggle("menu-open", open);
            trigger.setAttribute("aria-expanded", String(open));
        }

        trigger.addEventListener("click", function (event) {
            event.stopPropagation();
            setOpen(!menu.classList.contains("menu-open"));
        });

        
        document.addEventListener("click", function (event) {
            if (!menu.contains(event.target)) setOpen(false);
        });
        document.addEventListener("keydown", function (event) {
            if (event.key === "Escape") setOpen(false);
        });

        
        menu.addEventListener("click", function (event) {
            if (event.target.closest("a")) setOpen(false);
        });

        
        window.addEventListener("resize", function () {
            if (window.innerWidth > 768) setOpen(false);
        });
    })();
</script>

<script>
    let menu = document.getElementById('menu');
    if (menu) {
        
        const scrollPosition = localStorage.getItem("menu-scroll-position");
        if (scrollPosition) {
            menu.scrollLeft = parseInt(scrollPosition, 10);
        }

        menu.onscroll = function () {
            localStorage.setItem("menu-scroll-position", menu.scrollLeft);
        }
    }

    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener("click", function (e) {
            e.preventDefault();
            var id = this.getAttribute("href").substr(1);
            const navigate = () => {
                if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                    document.querySelector(`[id='${decodeURIComponent(id)}']`).scrollIntoView({
                        behavior: "smooth"
                    });
                } else {
                    document.querySelector(`[id='${decodeURIComponent(id)}']`).scrollIntoView();
                }
                if (id === "top") {
                    history.replaceState(null, null, " ");
                } else {
                    history.pushState(null, null, `#${id}`);
                }
            };
            
            
            const dialog = this.closest('.floating-panel-dialog[open]');
            if (dialog) {
                dialog.addEventListener('close', () => requestAnimationFrame(navigate), { once: true });
            } else {
                navigate();
            }
        });
    });

</script>
<script>
    document.getElementById("theme-toggle").addEventListener("click", () => {
        const html = document.querySelector("html");
        if (html.dataset.theme === "dark") {
            html.dataset.theme = 'light';
            localStorage.setItem("pref-theme", 'light');
        } else {
            html.dataset.theme = 'dark';
            localStorage.setItem("pref-theme", 'dark');
        }
    })

</script>
