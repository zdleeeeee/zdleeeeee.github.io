baseURL = 'https://example.org/'
locale = 'en-us'
title = 'Zed Lee'
theme = 'PaperMod'
[outputs]
  home = ["HTML", "RSS", "JSON"]
  page = ["HTML"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
  term = ["HTML", "RSS"]

# Let math delimiters pass through Goldmark untouched; KaTeX renders them client-side.
[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    block = [['\[', '\]'], ['$$', '$$']]
    inline = [['\(', '\)'], ['$', '$']]

[params]
  mainSections = ["posts"]
  ShowAllPagesInArchive = true
  ShowPostNavLinks = true
  goBackButton = false
  ShowShareButtons = true
  ShowNavbar = true
  ShowReadTime = true

  fuseOpts = {
    isCaseSensitive = false,
    shouldSort = true,
    minMatchCharLength = 2,
    keys = ["title", "permalink", "summary", "content"]
  }

  [params.profileMode]
    enabled = true
    title = "Zed Lee"
    subtitle = ""
    imageUrl = "../assets/images/profile.jpg"
    imageTitle = ""
    imageWidth = 150
    imageHeight = 150

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "posts"
    url = "/posts/"
    weight = 2
    
  [[menu.main]]
    identifier = "search"
    name = "search"
    url = "/search/"
    weight = 3
    
  [[menu.main]]
    identifier = "home"
    name = "home"
    url = "/"
    weight = 1
